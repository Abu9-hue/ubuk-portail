<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UBUK PAY • ATM Virtuel & Dorsale</title>
  <style>
    :root {
      --bg: #04070d;
      --chassis: #0e1522;
      --gold: #eab308;
      --emerald: #10b981;
      --cyan: #06b6d4;
      --muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #0b1324 0%, var(--bg) 70%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      border-radius: 16px;
    }

    .rib {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.65rem;
      color: var(--muted);
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 99px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      margin-right: 5px;
    }

    .hdr {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(90deg, #fff, var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      font-size: 0.73rem;
      color: var(--muted);
    }

    .ret-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 5px 10px;
      border-radius: 99px;
      color: #fff;
    }

    .ret-orb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(234, 179, 8, 0.15);
      color: var(--gold);
      display: grid;
      place-items: center;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .ret-txt {
      display: flex;
      flex-direction: column;
    }

    .ret-txt small {
      font-size: 0.54rem;
      color: var(--muted);
      text-transform: uppercase;
    }

    .ret-txt strong {
      font-size: 0.74rem;
      color: var(--gold);
    }

    /* CARTE 3D + LOGO DISCRET */
    .stage {
      perspective: 1200px;
      margin-bottom: 14px;
    }

    .c3d {
      width: 100%;
      height: 224px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
      cursor: pointer;
    }

    .c3d.flip {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .front {
      background: radial-gradient(circle at top right, #162238, #060b14);
      border: 1px solid rgba(234, 179, 8, 0.35);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
    }

    .back {
      transform: rotateY(180deg);
      background: #070d18;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .watermark {
      position: absolute;
      right: 14px;
      bottom: 8px;
      font-size: 3.2rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.04);
      pointer-events: none;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .b0 {
      padding: 4px 10px;
      border-radius: 99px;
      background: rgba(234, 179, 8, 0.15);
      color: var(--gold);
      font-size: 0.65rem;
      font-weight: 800;
    }

    .chip {
      width: 44px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, #eab308, #a16207);
    }

    .nfc {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--emerald);
    }

    .mag {
      height: 24px;
      margin: -16px -18px 8px;
      background: #020408;
    }

    .bgrid {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 12px;
      align-items: center;
    }

    .qr {
      width: 78px;
      height: 78px;
      background: #fff;
      border-radius: 8px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .qr i {
      background: #05080f;
      display: block;
      border-radius: 2px;
    }

    .fbtn {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 7px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 3 LEVIERS CHIRURGICAUX LUMINEUX */
    h2 {
      font-size: 0.82rem;
      font-weight: 800;
      color: #fff;
    }

    .lev {
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(255, 255, 255, 0.03);
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
    }

    .lev-icon {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 0.95rem;
    }

    .ic-cyan {
      background: rgba(6, 182, 212, 0.14);
      color: var(--cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .ic-gold {
      background: rgba(234, 179, 8, 0.14);
      color: var(--gold);
      border: 1px solid rgba(234, 179, 8, 0.3);
    }

    .ic-em {
      background: rgba(16, 185, 129, 0.14);
      color: var(--emerald);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .lev h3 {
      font-size: 0.84rem;
      color: var(--gold);
      margin-bottom: 2px;
    }

    .lev p {
      font-size: 0.74rem;
      color: #cbd5e1;
      line-height: 1.3;
    }

    .kyc-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .kpill {
      font-size: 0.62rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      background: rgba(16, 185, 129, 0.12);
      color: var(--emerald);
    }

    /* CHÂSSIS ATM VIRTUEL LUXE */
    .atm-chassis {
      margin-top: 18px;
      background: var(--chassis);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .atm-top-led {
      height: 6px;
      border-radius: 16px 16px 0 0;
      background: linear-gradient(90deg, var(--gold), var(--emerald), var(--cyan));
    }

    .atm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .atm-screen {
      background: radial-gradient(circle at center, #0c1629, #060a12);
      padding: 12px;
    }

    /* ASSISTANT CARTOON INTERACTIF */
    .guide-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      margin-bottom: 10px;
    }

    .bot-avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      background: var(--gold);
      color: #04070d;
      display: grid;
      place-items: center;
      font-weight: 900;
    }

    .guide-txt {
      font-size: 0.71rem;
      color: #e2e8f0;
      line-height: 1.35;
      flex: 1;
    }

    .guide-next {
      padding: 5px 9px;
      border-radius: 8px;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* TOUCHES TACTILES ATM LOCAL / CENTRAL */
    .atm-keys {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .atm-key {
      padding: 10px 8px;
      border-radius: 8px;
      background: #09111e;
      border: 1px solid var(--border);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    .atm-key.on {
      border-color: var(--emerald);
      color: var(--emerald);
    }

    /* SIMULATEUR ENCASTRÉ + COLONNES LUMINEUSES */
    .sim-box {
      background: rgba(4, 9, 18, 0.75);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 12px;
    }

    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 6px;
    }

    .inp, .sel {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      background: #09111e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 0.75rem;
    }

    .cols {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 8px;
    }

    .col-bar {
      background: #09111e;
      border: 1px solid var(--border);
      padding: 8px;
      border-radius: 8px;
      text-align: center;
    }

    .col-bar.lit {
      border-color: var(--gold);
    }

    .col-bar.lit-em {
      border-color: var(--emerald);
    }

    .col-val {
      font-size: 0.72rem;
      font-weight: 800;
      margin-top: 3px;
      color: #fff;
    }

    .col-lbl {
      font-size: 0.56rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }
