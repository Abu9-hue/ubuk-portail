<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none';" />
  <meta name="referrer" content="no-referrer" />
  <title>UBUK PAY • Carte Officielle Recto-Verso & ATM Virtuel Souverain</title>
  <style>
    :root {
      --bg-obsidian: #05080f;
      --bg-card: #0c1320;
      --gold-primary: #d4af37;
      --gold-light: #f6dc88;
      --gold-dim: rgba(212, 175, 55, 0.32);
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.38);
      --crimson: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --radius-lg: 22px;
      --radius-md: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: radial-gradient(circle at 20% 0%, #111d32 0%, var(--bg-obsidian) 58%, #020408 100%);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 580px;
      border: 1px solid var(--gold-dim);
      border-radius: 28px;
      padding: 22px 18px 34px;
      background: linear-gradient(180deg, rgba(13, 20, 34, 0.95) 0%, rgba(5, 8, 15, 0.99) 100%);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.82), inset 0 1px 0 rgba(246, 220, 136, 0.2);
    }
    .security-ribbon {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 999px;
      padding: 5px 12px;
      margin-bottom: 16px;
      font-size: 0.66rem;
      color: #6ee7b7;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .pulse-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      margin-right: 6px;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.85); } }
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 22px;
    }
    .page-title { font-size: 1.24rem; font-weight: 800; color: var(--gold-light); line-height: 1.25; }
    .page-subtitle { font-size: 0.76rem; color: var(--text-muted); margin-top: 4px; }
    .sovereign-return-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 15px 9px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18) 0%, rgba(10, 16, 26, 0.96) 100%);
      border: 1px solid rgba(16, 185, 129, 0.6);
      color: #ecfdf5;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 700;
      box-shadow: 0 6px 22px rgba(16, 185, 129, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
      overflow: hidden;
    }
    .sovereign-return-btn:hover { border-color: var(--gold-light); box-shadow: 0 8px 26px rgba(212, 175, 55, 0.38); transform: translateY(-2px); }
    .orbital-orb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #34d399, #047857);
      border: 1.5px solid var(--gold-light);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 0 12px var(--emerald-glow);
    }
    .orbital-orb::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px dashed rgba(246, 220, 136, 0.7);
      animation: spinSlow 9s linear infinite;
    }
    @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .return-text-stack { display: flex; flex-direction: column; line-height: 1.1; }
    .return-label-top { font-size: 0.6rem; text-transform: uppercase; color: var(--gold-light); letter-spacing: 0.08em; }
    .return-label-main { font-size: 0.82rem; font-weight: 800; color: #ffffff; }
    .card-stage { perspective: 1300px; margin-bottom: 12px; }
    .card-3d-wrapper {
      width: 100%;
      height: 242px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
    }
    .card-3d-wrapper.is-flipped { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid rgba(246, 220, 136, 0.5);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.22);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .card-front {
      background: radial-gradient(circle at 86% 18%, rgba(212, 175, 55, 0.28) 0%, transparent 48%),
                  radial-gradient(circle at 14% 86%, rgba(16, 185, 129, 0.2) 0%, transparent 50%),
                  linear-gradient(135deg, #172033 0%, #090d16 52%, #1b160c 100%);
    }
    .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; z-index: 1; }
    .card-brand { font-size: 0.86rem; font-weight: 800; letter-spacing: 0.06em; color: var(--gold-light); text-transform: uppercase; }
    .card-standard { font-size: 0.72rem; color: #e5e7eb; letter-spacing: 0.08em; font-weight: 600; }
    .badge-zero-interest { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--emerald); background: rgba(16, 185, 129, 0.16); color: #34d399; font-size: 0.68rem; font-weight: 800; }
    .card-chip-row { display: flex; align-items: center; justify-content: space-between; margin: 6px 0; z-index: 1; }
    .emv-chip { width: 46px; height: 34px; border-radius: 7px; background: linear-gradient(135deg, #f6dc88 0%, #b8860b 50%, #f6dc88 100%); border: 1px solid #785506; position: relative; }
    .card-era-stamp { font-size: 0.82rem; font-weight: 700; letter-spacing: 0.14em; color: #f9fafb; }
    .nfc-waves { color: var(--gold-light); font-size: 1.15rem; opacity: 0.9; font-weight: 700; }
    .card-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; z-index: 1; }
    .card-tech-meta { font-size: 0.72rem; color: #d1d5db; }
    .card-tech-meta strong { color: var(--gold-light); display: block; font-size: 0.78rem; }
    .card-accounts-pill { text-align: right; font-size: 0.74rem; font-weight: 800; color: var(--gold-light); line-height: 1.25; }
    .card-back { transform: rotateY(180deg); background: linear-gradient(145deg, #0b101b 0%, #141e32 100%); padding: 16px 18px; }
    .mag-stripe { height: 28px; margin: -16px -18px 10px; background: linear-gradient(90deg, #030508, #1f2937, #030508); border-bottom: 1px solid var(--gold-dim); }
    .back-grid { display: grid; grid-template-columns: 86px 1fr; gap: 14px; align-items: center; flex: 1; }
    .qr-box { width: 86px; height: 86px; background: #ffffff; border-radius: 10px; padding: 6px; display: flex; align-items: center; justify-content: center; border: 2px solid var(--gold-primary); }
    .back-details h4 { font-size: 0.76rem; color: var(--gold-light); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .back-details p { font-size: 0.68rem; color: #d1d5db; line-height: 1.35; }
    .biometric-badge-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .bio-tag { font-size: 0.62rem; padding: 2px 7px; border-radius: 6px; background: rgba(212, 175, 55, 0.14); border: 1px solid rgba(212, 175, 55, 0.42); color: var(--gold-light); font-weight: 600; }
    .card-back-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.64rem; color: var(--text-muted); border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 6px; margin-top: 6px; }
    .flip-controls { display: flex; justify-content: center; margin-bottom: 22px; }
    .flip-trigger { background: rgba(212, 175, 55, 0.12); border: 1px solid var(--gold-dim); color: var(--gold-light); font-size: 0.75rem; font-weight: 700; padding: 7px 16px; border-radius: 999px; cursor: pointer; }
    .section-heading { font-size: 0.86rem; font-weight: 800; color: var(--gold-light); text-transform: uppercase; letter-spacing: 0.04em; margin: 22px 0 12px; }
    .lever-card { background: var(--bg-card); border-radius: var(--radius-md); padding: 14px 16px; margin-bottom: 10px; border: 1px solid rgba(255, 255, 255, 0.07); border-left-width: 4px; }
    .lever-red { border-left-color: var(--crimson); }
    .lever-gold { border-left-color: var(--gold-primary); }
    .lever-green { border-left-color: var(--emerald); }
    .lever-card h3 { font-size: 0.88rem; font-weight: 700; color: var(--gold-light); margin-bottom: 5px; }
    .lever-card p { font-size: 0.78rem; color: #d1d5db; line-height: 1.45; }
    .atm-console, .simulator-box { background: var(--bg-card); border: 1px solid var(--gold-dim); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 18px; }
    .atm-modes, .sim-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .atm-mode-btn { padding: 10px 8px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(255, 255, 255, 0.03); color: var(--text-main); font-size: 0.74rem; font-weight: 700; cursor: pointer; }
