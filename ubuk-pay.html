<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UBUK PAY — Visuel Officiel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100vh;background:#060A11;display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:440px;aspect-ratio:1.58/1;border-radius:22px;position:relative;overflow:hidden;border:1.5px solid #F5B041;box-shadow:0 20px 50px rgba(0,0,0,.85),0 0 30px rgba(245,176,65,.18);background:linear-gradient(135deg,#0B111C 0%,#060A11 60%,#08201A 100%);padding:22px;display:flex;flex-direction:column;justify-content:space-between;color:#F8FAFC}
.card svg.bg{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
.top,.mid,.bot{position:relative;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px}
.emblem{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#F5B041,#B9770E);color:#060A11;display:grid;place-items:center;font-weight:900;font-size:1rem;box-shadow:0 4px 12px rgba(245,176,65,.4)}
.brand h1{font-size:1.15rem;letter-spacing:1.5px;color:#F5B041;font-weight:900}
.brand span{font-size:.66rem;color:#00E5A0;letter-spacing:.8px;display:block;font-weight:700}
.chip-row{display:flex;align-items:center;gap:12px}
.chip{width:44px;height:32px;border-radius:7px;background:linear-gradient(135deg,#F9E79F,#D4AC0D,#9A7D0A);border:1px solid #FFF3CD;position:relative}
.chip::after{content:"";position:absolute;inset:6px;border:1px solid rgba(6,10,17,.45);border-radius:3px}
.mid h2{font-size:1.05rem;letter-spacing:2.5px;color:#F8FAFC;font-weight:700;margin-bottom:4px}
.mid p{font-size:.72rem;color:#94A3B8}
.bot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(245,176,65,.28);padding-top:10px}
.tag{font-size:.68rem;color:#00E5A0;font-weight:800;letter-spacing:.6px}
.net{font-size:.78rem;color:#F5B041;font-weight:900;letter-spacing:1px}
</style>
</head>
<body>
<div class="card">
  <svg class="bg"><defs><pattern id="z" width="32" height="32" patternUnits="userSpaceOnUse"><polygon points="16,0 20,7 27,5 25,12 32,16 25,20 27,27 20,25 16,32 12,25 5,27 7,20 0,16 7,12 5,5 12,7" fill="none" stroke="#F5B041" stroke-width=".55"/><polygon points="16,4 19,10 25,7 22,13 28,16 22,19 25,25 19,22 16,28 13,22 7,25 10,19 4,16 10,13 7,7 13,10" fill="none" stroke="#00E5A0" stroke-width=".5"/><circle cx="16" cy="16" r="3.5" fill="none" stroke="#F5B041" stroke-width=".5"/></pattern></defs><rect width="100%" height="100%" fill="url(#z)"/></svg>
  <div class="top">
    <div class="brand"><div class="emblem">UP</div><div><h1>UBUK PAY</h1><span>DORSALE FINANCIÈRE SOUVERAINE</span></div></div>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00E5A0" stroke-width="2" stroke-linecap="round"><path d="M5 12.5a7 7 0 0 1 0-1"/><path d="M8.5 14.5a11 11 0 0 1 0-5"/><path d="M12 16.5a15 15 0 0 1 0-9"/><path d="M15.5 18.5a19 19 0 0 1 0-13"/></svg>
  </div>
  <div class="mid">
    <div class="chip-row"><div class="chip"></div><div><h2>•••• •••• •••• 2026</h2><p>Bouclier 100–250 XAF/j • Épargne UBUK &amp; Zakat</p></div></div>
  </div>
  <div class="bot">
    <div class="tag">MTN • ORANGE • WAVE • M-PESA • SHA-256</div>
    <div class="net">UBUK.NET</div>
  </div>
</div>
</body>
</html>
